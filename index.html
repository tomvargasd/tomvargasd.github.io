<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tomvargasd</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.3/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        github: {
                            dark: '#0d1117',
                            text: '#c9d1d9',
                            link: '#58a6ff',
                            border: '#30363d'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-800 text-white min-h-screen">1
    <div class="container mx-auto px-2 py-8 max-w-4xl">
        <!-- Header -->
        <header class="flex flex-col md:flex-row items-center mb-8 pb-6 border-b border-github-border">
            <div class="flex items-center mb-4 md:mb-0">
                <div class="mr-4">
                    <img id="avatar" src="/api/placeholder/200/200" alt="tomvargasd" class="w-24 h-24 rounded-full border-2 border-github-border"/>
                </div>
                <div>
                    <h1 class="text-3xl font-bold text-white">tomvargasd</h1>
                    <p class="text-gray-400">GitHub Developer</p>
                </div>
            </div>
            <div class="ml-auto flex space-x-2">
                <a href="https://github.com/tomvargasd" target="_blank" class="bg-gray-800 hover:bg-gray-700 text-white py-2 px-4 rounded-md flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path>
                    </svg>
                    View on GitHub
                </a>
            </div>
        </header>

        <!-- Main content -->
        <main>
            <div class="bg-gray-800 rounded-lg p-6 mb-6 shadow-lg">
                <h2 class="text-xl font-semibold text-white mb-4">README.md</h2>
                <div id="readme-content" class="prose prose-invert max-w-none">
                    <!-- README content will be loaded here -->
                    <div class="animate-pulse">
                        <div class="h-4 bg-gray-700 rounded w-3/4 mb-4"></div>
                        <div class="h-4 bg-gray-700 rounded w-1/2 mb-4"></div>
                        <div class="h-4 bg-gray-700 rounded w-5/6 mb-4"></div>
                        <div class="h-4 bg-gray-700 rounded w-2/3 mb-4"></div>
                        <div class="h-4 bg-gray-700 rounded w-3/4 mb-4"></div>
                    </div>
                </div>
            </div>

            <!-- Projects section -->
            <div class="bg-gray-800 rounded-lg p-6 mb-6 shadow-lg">
                <h2 class="text-xl font-semibold text-white mb-4">Projects</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Project card -->
                    <div class="border border-github-border rounded-md p-4 hover:bg-gray-700 transition duration-200">
                        <h3 class="font-medium text-github-link">Gramood-wallpapers</h3>
                        <p class="text-sm text-gray-400 mt-2">Beautiful wallpapers generator</p>
                        <div class="mt-4">
                            <a href="/Gramood-wallpapers/" class="bg-github-link text-white py-2 px-4 rounded-md text-sm inline-block hover:bg-blue-600 transition duration-200">
                                View Project
                            </a>
                        </div>
                    </div>
                    <div class="border border-github-border rounded-md p-4 hover:bg-gray-700 transition duration-200">
                        <h3 class="font-medium text-github-link">ERP System</h3>
                        <p class="text-sm text-gray-400 mt-2">System for store products</p>
                        <div class="mt-4">
                            <a href="/Gramood-wallpapers/" class="bg-github-link text-white py-2 px-4 rounded-md text-sm inline-block hover:bg-blue-600 transition duration-200">
                                View Project
                            </a>
                        </div>
                    </div>
                    <!-- More project cards could be added here -->
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="mt-12 pt-6 border-t border-github-border text-center text-gray-400 text-sm">
            <p>&copy; 2025 tomvargasd. All rights reserved.</p>
        </footer>
    </div>

    <script>
        // Fetch the GitHub avatar and README.md
        async function fetchGitHubData() {
            try {
                // Fetch user data to get avatar
                const userResponse = await fetch('https://api.github.com/users/tomvargasd');
                if (userResponse.ok) {
                    const userData = await userResponse.json();
                    if (userData.avatar_url) {
                        document.getElementById('avatar').src = userData.avatar_url;
                    }
                }

                // Fetch README content
                const readmeResponse = await fetch('https://raw.githubusercontent.com/tomvargasd/tomvargasd/main/README.md');
                if (readmeResponse.ok) {
                    const readmeText = await readmeResponse.text();
                    document.getElementById('readme-content').innerHTML = marked.parse(readmeText);
                } else {
                    document.getElementById('readme-content').innerHTML = `
                        <p>README content could not be loaded. Please check the repository at 
                        <a href="https://github.com/tomvargasd/tomvargasd" class="text-github-link">
                            https://github.com/tomvargasd/tomvargasd
                        </a>.</p>
                    `;
                }
            } catch (error) {
                console.error('Error fetching GitHub data:', error);
                document.getElementById('readme-content').innerHTML = `
                    <p>An error occurred while loading the data. Please try again later or visit 
                    <a href="https://github.com/tomvargasd" class="text-github-link">
                        https://github.com/tomvargasd
                    </a> directly.</p>
                `;
            }
        }

        // Run when the page loads
        window.addEventListener('DOMContentLoaded', fetchGitHubData);
    </script>
</body>
</html>
